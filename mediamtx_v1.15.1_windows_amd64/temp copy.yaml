# Enable all protocols
protocols: [tcp, udp]
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

paths:
  # ========================================
  # Python 处理后的流（由 Python 推送）
  # ========================================
  left:
    # 不设置 source，允许 Python 作为 publisher 推流
    runOnReady: echo "Left stream connected"
    runOnNotReady: echo "Left stream disconnected"
    
  right:
    # 不设置 source，允许 Python 作为 publisher 推流
    runOnReady: echo "Right stream connected"
    runOnNotReady: echo "Right stream disconnected"
    
  combined:
    # 不设置 source，允许 Python 作为 publisher 推流
    runOnReady: echo "Combined stream connected"
    runOnNotReady: echo "Combined stream disconnected"

  # ========================================
  # 原有的摄像头流
  # ========================================
  cam1:
    source: rtsp://user1:h7Hsu3ULLnLTs*M@10.10.95.215:554/media/video1
    sourceProtocol: tcp  # Force TCP for reliability
    sourceOnDemand: yes  # Only connect when client requests
    overridePublisher: yes  # Allow multiple connections
    
  cam1/webrtc:
    source: rtsp://user1:h7Hsu3ULLnLTs*M@10.10.95.215:554/media/video1
    sourceProtocol: tcp
    
