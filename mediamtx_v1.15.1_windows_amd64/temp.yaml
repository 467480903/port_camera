# Enable all protocols
protocols: [tcp, udp]
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

paths:
  # ========================================
  # Python 处理后的流（由 Python 推送）
  # ========================================
  # left:
  #   # 不设置 source，允许 Python 作为 publisher 推流
  #   runOnReady: echo "Left stream connected"
  #   runOnNotReady: echo "Left stream disconnected"

  # left/webrtc:
  #   source: rtsp://localhost:8554/left
  #   sourceProtocol: tcp
    
  # right:
  #   # 不设置 source，允许 Python 作为 publisher 推流
  #   runOnReady: echo "Right stream connected"
  #   runOnNotReady: echo "Right stream disconnected"

  # right/webrtc:
  #   source: rtsp://localhost:8554/right
  #   sourceProtocol: tcp
    
  # combined:
  #   # 不设置 source，允许 Python 作为 publisher 推流
  #   runOnReady: echo "Combined stream connected"
  #   runOnNotReady: echo "Combined stream disconnected"

  # combined/webrtc:
