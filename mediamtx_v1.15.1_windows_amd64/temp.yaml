# Enable all protocols
protocols: [tcp, udp]
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

paths:
  # Camera 1 - Simple RTSP endpoint
  cam1:
    source: rtsp://user1:h7Hsu3ULLnLTs*M@10.10.95.215:554/media/video1
    sourceProtocol: tcp  # Force TCP for reliability
    sourceOnDemand: yes  # Only connect when client requests
    overridePublisher: yes  # Allow multiple connections
    
  cam1/webrtc:
    source: rtsp://user1:h7Hsu3ULLnLTs*M@10.10.95.215:554/media/video1
    sourceProtocol: tcp

