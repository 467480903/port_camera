<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP 4 Parts</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            height: 100vh;
        }
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f1f1;
        }
        .video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <img src="http://127.0.0.1:5000/video_feed2" class="video" alt="Camera 1">
        </div>
        <div class="video-container">
            <img src="http://127.0.0.1:5000/video_feed3" class="video" alt="Camera 2">
        </div>
        <div class="video-container">
            <!-- This cell is left empty for the fourth part -->
        </div>
        <div class="video-container">
            <img src="http://127.0.0.1:5000/video_feed1" class="video" alt="Camera 3">  
        </div>
    </div>
</body>
</html>
