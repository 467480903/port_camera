<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cameras Set A</title>
    <style>
        body {
            margin: 0px;
            background-color: black;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #container {
            display: grid;
            grid-template-columns: 50% 50%;
            grid-template-rows: 50% 50%;
            gap: 10px;
            padding: 10px;
            flex-grow: 1;
        }

        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            border: 1px solid #444;
        }

        .video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
        }

        .controls button {
            width: 100px;
            height: 100px;
            font-size: 16px;
        }

        #toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #222;
            color: white;
        }

        #toolbar .toolbar-content {
            display: flex;
            align-items: center;
        }

        #toolbar button {
            background-color: #555;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 10px;
        }

        #toolbar button:hover {
            background-color: #777;
        }

        .light {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 0 5px;
        }

        .red {
            background-color: red;
        }

        .blue {
            background-color: blue;
        }

        .white {
            background-color: white;
        }
    </style>
    <script defer src="node-red/static/reader.js"></script>
</head>

<body>
    <div id="container">
        <div class="video-container" id="video1"></div>
        <div class="video-container" id="video2"></div>
        <div class="video-container" id="video3"></div>
        <div class="video-container" id="video4"></div>
    </div>

    <div id="toolbar">
        <div class="toolbar-content">
            <button onclick="toggleFullScreen()">Fullscreen</button>
            <div style="padding-left: 1100px;">
                Gantry: 34.2M, Trolley: 12.2M, Hoist: 22.2M
            </div>
        </div>
        <div class="toolbar-content">
            <div class="light red"></div>
            <div class="light blue"></div>
            <div class="light white"></div>
            <div class="light red"></div>
        </div>
    </div>

    <script>
        function sendCommand(ball, direction, data) {
            const url = `http://127.0.0.1:1881/${ball}_${direction}?data=${data}`;
            fetch(url, { method: 'GET' });
        }

        function toggleFullScreen() {
            const body = document.body;
            if (body.requestFullscreen) {
                body.requestFullscreen();
            } else if (body.mozRequestFullScreen) { // Firefox
                body.mozRequestFullScreen();
            } else if (body.webkitRequestFullscreen) { // Chrome, Safari and Opera
                body.webkitRequestFullscreen();
            } else if (body.msRequestFullscreen) { // IE/Edge
                body.msRequestFullscreen();
            }
        }

        function setVideoContainerHeight() {
            const docHeight = document.documentElement.clientHeight;
            const videoContainers = document.querySelectorAll('.video-container');
            videoContainers.forEach(container => {
                container.style.height = `${(docHeight - 80) / 2}px`; // Subtract toolbar height
            });
        }

        window.addEventListener('load', setVideoContainerHeight);
        window.addEventListener('resize', setVideoContainerHeight);

        const parseBoolString = (str, defaultVal) => {
            str = (str || '');

            if (['1', 'yes', 'true'].includes(str.toLowerCase())) {
                return true;
            }
            if (['0', 'no', 'false'].includes(str.toLowerCase())) {
                return false;
            }
            return defaultVal;
        };

        let readers = [];

        const loadAttributesFromQuery = () => {
            const params = new URLSearchParams(window.location.search);
            const videoContainers = document.querySelectorAll('.video-container');
            videoContainers.forEach((container, index) => {
                const videoElement = container.querySelector('video');
                if (videoElement) {
                    videoElement.controls = parseBoolString(params.get('controls'), true);
                    videoElement.muted = parseBoolString(params.get('muted'), true);
                    videoElement.autoplay = parseBoolString(params.get('autoplay'), true);
                    videoElement.playsInline = parseBoolString(params.get('playsinline'), true);
                    videoElement.disablepictureinpicture = parseBoolString(params.get('disablepictureinpicture'), false);
                }
            });
        };

        const loadDefaultStreams = () => {
            const defaultStreams = [
                'http://localhost:8889/cam6/webrtc/',
                'http://localhost:8889/cam7/webrtc/',
                'http://localhost:8889/cam8/webrtc/',
                'http://localhost:8889/cam9/webrtc/',
            ];

            defaultStreams.forEach((streamUrl, index) => {
                if (index < 4) {
                    const videoContainer = document.getElementById(`video${index + 1}`);
                    // Clear existing content
                    videoContainer.innerHTML = '';
                    const videoElement = document.createElement('video');
                    videoElement.id = `video${index + 1}`;
                    videoElement.className = 'video';
                    videoElement.autoplay = true;
                    videoElement.playsInline = true;
                    videoContainer.appendChild(videoElement);

                    const reader = new MediaMTXWebRTCReader({
                        url: new URL('whep', streamUrl),
                        onError: (err) => {
                            // setMessage(err);
                        },
                        onTrack: (evt) => {
                            // setMessage('');
                            // console.debug(evt);
                            videoElement.autoplay = true;
                            videoElement.controls = true;
                            videoElement.muted = true;
                            videoElement.playsInline = true;
                            videoElement.disablepictureinpicture = false;
                            videoElement.srcObject = evt.streams[0];

                        },
                    });
                    readers.push(reader);
                }
            });
        };

        window.addEventListener('load', () => {
            loadAttributesFromQuery();

            const ws = new WebSocket('ws://10.10.95.222:1881/setB');
            ws.onmessage = function (event) {
                // Close all WebRTC connections
                readers.forEach(reader => {
                    reader.close();
                });

                // Clear the readers array
                readers = [];

                const data = JSON.parse(event.data);
                console.debug(data);
                data.forEach(item => {
                    if (item.type === 'video' && readers.length < 4) {
                        const videoContainer = document.getElementById(`video${readers.length + 1}`);
                        // Clear existing content
                        videoContainer.innerHTML = '';
                        const videoElement = document.createElement('video');
                        videoElement.id = `video${readers.length + 1}`;
                        videoElement.className = 'video';
                        videoElement.autoplay = true;
                        videoElement.playsInline = true;
                        videoContainer.appendChild(videoElement);

                        const reader = new MediaMTXWebRTCReader({
                            url: new URL('whep', item.address),
                            onError: (err) => {
                                // setMessage(err);
                            },
                            onTrack: (evt) => {
                                // setMessage('');
                                videoElement.autoplay = true;
                                videoElement.controls = true;
                                videoElement.muted = true;
                                videoElement.playsInline = true;
                                videoElement.disablepictureinpicture = false;
                                videoElement.srcObject = evt.streams[0];
                            },
                        });
                        readers.push(reader);
                    } else if (item.type === 'video_control' && readers.length < 4) {
                        const videoContainer = document.getElementById(`video${readers.length + 1}`);
                        // Clear existing content
                        videoContainer.innerHTML = '';
                        const videoElement = document.createElement('video');
                        videoElement.id = `video${readers.length + 1}`;
                        videoElement.className = 'video';
                        videoElement.autoplay = true;
                        videoElement.playsInline = true;
                        videoContainer.appendChild(videoElement);

                        const controlDiv = document.createElement('div');
                        controlDiv.className = 'controls';
                        controlDiv.innerHTML = `
                            <div></div>
                            <div><button onmousedown="sendCommand('ball${readers.length + 1}', 'up', 1)" onmouseup="sendCommand('ball${readers.length + 1}', 'up', 2)">Up</button></div>
                            <div></div>
                            <div><button onmousedown="sendCommand('ball${readers.length + 1}', 'left', 1)" onmouseup="sendCommand('ball${readers.length + 1}', 'left', 2)">Left</button></div>
                            <div><button onmousedown="sendCommand('ball${readers.length + 1}', 'center', 1)" onmouseup="sendCommand('ball${readers.length + 1}', 'center', 2)">Center</button></div>
                            <div><button onmousedown="sendCommand('ball${readers.length + 1}', 'right', 1)" onmouseup="sendCommand('ball${readers.length + 1}', 'right', 2)">Right</button></div>
                            <div></div>
                            <div><button onmousedown="sendCommand('ball${readers.length + 1}', 'down', 1)" onmouseup="sendCommand('ball${readers.length + 1}', 'down', 2)">Down</button></div>
                            <div></div>
                        `;
                        videoContainer.appendChild(controlDiv);

                        const reader = new MediaMTXWebRTCReader({
                            url: new URL('whep', item.address),
                            onError: (err) => {
                            },
                            onTrack: (evt) => {
                                videoElement.autoplay = true;
                                videoElement.controls = true;
                                videoElement.muted = true;
                                videoElement.playsInline = true;
                                videoElement.disablepictureinpicture = false;
                                videoElement.srcObject = evt.streams[0];
                            },
                        });
                        readers.push(reader);
                    }
                });
            };

            ws.onopen = function () {
                console.log('WebSocket connection established.');
            };

            ws.onerror = function (error) {
                console.error('WebSocket error:', error);
                loadDefaultStreams();
            };

            ws.onclose = function (event) {
                console.log('WebSocket connection closed:', event);
                if (readers.length === 0) {
                    loadDefaultStreams();
                }
            };

            setTimeout(() => {
                if (readers.length === 0) {
                    loadDefaultStreams();
                }
            }, 5000); // Wait 5 seconds for data, then load defaults if no data received
        });
    </script>
</body>

</html>
